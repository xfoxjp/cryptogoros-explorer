<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoGoros Explorer</title>
    <style>
        :root { --goros-orange: #FF6600; --bg-color: #FFF5EE; }
        body { font-family: sans-serif; background: var(--bg-color); padding: 20px; color: #333; margin: 0; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(255,102,0,0.1); }
        h1 { color: var(--goros-orange); text-align: center; margin-bottom: 20px; letter-spacing: 2px; }
        .search-box { display: flex; gap: 5px; margin-bottom: 25px; align-items: center; }
        input { flex: 1; padding: 12px; border: 2px solid #FFE0C0; border-radius: 10px; font-size: 16px; outline: none; text-align: center; }
        .btn-base { padding: 12px 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-main { background: var(--goros-orange); color: white; flex: 1.5; }
        .btn-nav { background: #eee; color: #333; flex: 0.5; }
        .btn-base:hover { opacity: 0.8; }
        #result { display: none; border-top: 2px solid #FFE0C0; padding-top: 20px; }
        #mediaContainer { width: 100%; aspect-ratio: 1/1; background: #eee; border-radius: 15px; overflow: hidden; position: relative; margin-bottom: 20px; }
        .media-wrapper { position: relative; width: 100%; height: 100%; }
        .full-link { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
        .partial-link { position: absolute; top: 0; left: 0; width: 100%; height: 85%; z-index: 10; cursor: pointer; }
        .info-label { font-size: 11px; color: #CC5500; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .info-value { font-size: 15px; margin-bottom: 15px; word-break: break-all; min-height: 24px; }
        #nftTraits { display: flex; flex-wrap: wrap; gap: 8px; }
        .trait-card { background:#FFF5EE; border:1px solid #FFE0C0; border-radius:8px; padding:8px; text-align:center; flex:1 1 calc(33% - 8px); text-decoration:none; color:inherit; font-size:11px; }
        table { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 10px; }
        tr { border-bottom: 1px solid #eee; }
        td { padding: 10px 0; }
        
        /* オーナーリンクのスタイル */
        #nftOwnerLink { color:#FF6600; font-weight:bold; text-decoration: none; }
        #nftOwnerLink.active { text-decoration: underline; pointer-events: auto; opacity: 1; }
        #nftOwnerLink.loading { pointer-events: none; opacity: 0.6; text-decoration: none; }
        .staking-tag { color: #FF6600; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>CryptoGoros</h1>
    <div class="search-box">
        <button id="prevBtn" class="btn-base btn-nav">◀</button>
        <input type="number" id="tokenId" value="1" min="1" max="2000">
        <button id="nextBtn" class="btn-base btn-nav">▶</button>
        <button id="fetchBtn" class="btn-base btn-main">表示</button>
    </div>

    <div id="result">
        <div id="mediaContainer"></div>
        <div class="info-label">Name</div>
        <div id="nftTitle" style="font-weight:bold; font-size:18px; margin-bottom:15px;"></div>
        <div class="info-label">Owner</div>
        <div class="info-value">
            <a id="nftOwnerLink" href="javascript:void(0)" target="_blank" class="loading"></a>
            <span id="stakingStatus" class="staking-tag"></span>
        </div>
        <div class="info-label">Traits</div>
        <div id="nftTraits"></div>
        <div class="info-label" style="margin-top:20px;">History</div>
        <table><tbody id="hBody"></tbody></table>
    </div>
</div>

<script>
const API_KEY = "xsfAkUztgC2QOCiy0ElXe"; 
const CONTRACT = "0x6C621364993E5CD4C6468930d287ba76Ef64F366";
const STAKING_ADDR = "0xa0333635ba418ceb9fcc4ac3f2f39aa492f4d0f7";
let currentRequestId = 0;
const VIDEO_IDS = [1660, 1640, 1635, 1626, 1620, 1646, 1079, 1374, 1806 ,1845 ,1863];

window.onload = function() {
    const fetchBtn = document.getElementById('fetchBtn');
    const input = document.getElementById('tokenId');

    const trigger = (delta) => {
        let v = parseInt(input.value) + delta;
        if (v >= 1 && v <= 2000) { input.value = v; executeFetch(v); }
    };
    document.getElementById('prevBtn').onclick = () => trigger(-1);
    document.getElementById('nextBtn').onclick = () => trigger(1);
    fetchBtn.onclick = () => executeFetch(parseInt(input.value));

    async function executeFetch(tid) {
        if (isNaN(tid) || tid < 1 || tid > 2000) return;
        const requestId = ++currentRequestId;
        const resultDiv = document.getElementById('result');
        const media = document.getElementById('mediaContainer');
        const hBody = document.getElementById('hBody');
        const stakingTag = document.getElementById('stakingStatus');
        const ownerLink = document.getElementById('nftOwnerLink');

        fetchBtn.disabled = true;
        fetchBtn.innerText = "読込中...";
        resultDiv.style.display = 'none';
        media.innerHTML = "";
        
        stakingTag.innerText = "";
        ownerLink.innerText = "";
        ownerLink.href = "javascript:void(0)";
        ownerLink.className = "loading";
        
        hBody.innerHTML = "<tr><td>データを同期中...</td></tr>";

        try {
            const nftUrl = `https://polygon-mainnet.g.alchemy.com/nft/v3/${API_KEY}/getNFTMetadata?contractAddress=${CONTRACT}&tokenId=${tid}&refreshCache=true`;
            const nftRes = await fetch(nftUrl);
            const data = await nftRes.json();

            if (requestId !== currentRequestId) return;

            const meta = data.raw?.metadata || {};
            const osLink = `https://opensea.io/assets/matic/${CONTRACT}/${tid}`;
            
            let osImg = `https://api.opensea.io/api/v1/asset/${CONTRACT}/${tid}/image?w=600`;
            let fMedia = (meta.animation_url || meta.image || "").replace("ipfs://", "https://ipfs.io/ipfs/").replace("ar://", "https://arweave.net/");

            // --- 個別URL対応セクション ---
            if (tid === 1625) { osImg = "https://arweave.net/MSQ8bKLDZtgGxMIq4HoouWzYcduSaVJrdQruWHuO8Lw"; fMedia = osImg; }
            else if (tid === 1731) { osImg = "https://i2c.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/a7fdbee22be8fbdda1605626124c19/92a7fdbee22be8fbdda1605626124c19.png?w=1000"; fMedia = osImg; }
            else if (tid === 1079) { fMedia = "https://ipfs.io/ipfs/QmUAU6U8iL1zBWYs24jdTBsxjGuzFdt8X4qBSwuDynLEzQ"; osImg = fMedia; }
            else if (tid === 1374) { fMedia = "https://arweave.net/oB86Of8T6IoWBPsKmRkxoxWPIO3oIv8QX0nLKmXuQ44"; osImg = fMedia; }
            else if (tid === 1699) { osImg = "https://arweave.net/RM80fZPU8VJBpj0Bd5SMxuFgaHoLODf8yhCB-Z9WY2s"; fMedia = osImg; }
            else if (tid === 1705) { osImg = "https://arweave.net/p5g88z6KwKVnjS7QefCGbs6myXOPwV7Mq8dtc3UEgpU"; fMedia = osImg; }
            else if (tid === 1807) { osImg = "https://arweave.net/6ouIFbxYHizB3oZ1ZUC5tVS1LRzGBlWJ6YuAObgI5fE"; fMedia = osImg; }
            else if (tid === 1814) { osImg = "https://arweave.net/R5dgDwfinf0TCx-XMCxGGk63f1PYF4CWsmZb4h67G7s"; fMedia = osImg; }
            // 静止画ハッシュ対応
            else if (tid === 1344) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/5befc1edcc3da1dabaa1cd717c40ae/765befc1edcc3da1dabaa1cd717c40ae.gif"; fMedia = osImg; }
            else if (tid === 1413) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/4fd73db65a27b898095da0158d1d4e/144fd73db65a27b898095da0158d1d4e.gif"; fMedia = osImg; }
            else if (tid === 1439) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/43026c5bd19d24532422c0913fb490/2143026c5bd19d24532422c0913fb490.png"; fMedia = osImg; }
            else if (tid === 1446) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/e616f5a259f72bf6a37589e6b6942e/c1e616f5a259f72bf6a37589e6b6942e.png"; fMedia = osImg; }
            else if (tid === 1469) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/6041755764a414b23d38a22e4ace76/186041755764a414b23d38a22e4ace76.png"; fMedia = osImg; }
            else if (tid === 1473) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/188fe9b85250258fdf72277f09e286/e4188fe9b85250258fdf72277f09e286.png"; fMedia = osImg; }
            else if (tid === 1867) { osImg = "https://i2c.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/f30de34c69db13c7975c50f1fc0f4c/f2f30de34c69db13c7975c50f1fc0f4c.png"; fMedia = osImg; }
            else if (tid === 1868) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/83766ba4cb6e1975f9a766e18fc777/1883766ba4cb6e1975f9a766e18fc777.gif"; fMedia = osImg; }
            else if (tid === 1869) { osImg = "https://i2c.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/66870f989515f79a19879388a9cd2a/4166870f989515f79a19879388a9cd2a.png"; fMedia = osImg; }
            else if (tid === 1870) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/879043e60b21205033b06441a395d1/db879043e60b21205033b06441a395d1.gif"; fMedia = osImg; }
            else if (tid === 1871) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/f730fb3927516d91f3fbdd17d27b64/93f730fb3927516d91f3fbdd17d27b64.gif"; fMedia = osImg; }
            else if (tid === 1872) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/cd578a476c244de9f62052b9d565ce/76cd578a476c244de9f62052b9d565ce.gif"; fMedia = osImg; }
            else if (tid === 1873) { osImg = "https://i2c.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/8ddc9851353cf1b08bb125ad3b925a/448ddc9851353cf1b08bb125ad3b925a.png"; fMedia = osImg; }
            else if (tid === 1874) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/badf2e68c1dcac8dd0acd8c17d2f15/94badf2e68c1dcac8dd0acd8c17d2f15.gif"; fMedia = osImg; }
            else if (tid === 1875) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/8e2895dbff516ea01d8b4640b2b405/7e8e2895dbff516ea01d8b4640b2b405.gif"; fMedia = osImg; }
            else if (tid === 1876) { osImg = "https://i2c.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/464b35d912a512e32dfda433d87631/3b464b35d912a512e32dfda433d87631.png"; fMedia = osImg; }
            else if (tid === 1877) { osImg = "https://i2c.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/518a03a66488cc77f5240bc07b4bcb/fb518a03a66488cc77f5240bc07b4bcb.png"; fMedia = osImg; }
            else if (tid === 1878) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/8179aad7a18555ae559b2835b613a4/758179aad7a18555ae559b2835b613a4.gif"; fMedia = osImg; }
            else if (tid === 1879) { osImg = "https://i2c.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/cb44d8f60eb50888e5f37e7378ef69/fdcb44d8f60eb50888e5f37e7378ef69.png"; fMedia = osImg; }
            else if (tid === 1880) { osImg = "https://i2c.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/44fefbdbb03c47f5612ee2d30ac4bf/9944fefbdbb03c47f5612ee2d30ac4bf.png"; fMedia = osImg; }
            else if (tid === 1881) { osImg = "https://i2c.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/a65e1b78f9e07dcd73e86cfd0edd28/c7a65e1b78f9e07dcd73e86cfd0edd28.png"; fMedia = osImg; }
            else if (tid === 1882) { osImg = "https://i2c.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/c957f61190a4052e70deb7a8bb6756/8bc957f61190a4052e70deb7a8bb6756.png"; fMedia = osImg; }
            else if (tid === 1883) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/f49cf7e7ca24305f99f3f6f3f1eb4a/fef49cf7e7ca24305f99f3f6f3f1eb4a.gif"; fMedia = osImg; }
            else if (tid === 1884) { osImg = "https://i2c.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/faa8d55bbc3f792ab6db244800b5b2/94faa8d55bbc3f792ab6db244800b5b2.png"; fMedia = osImg; }
            else if (tid === 1885) { osImg = "https://i2c.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/52d120b0bcc3a6581a299f05f1d2d9/d352d120b0bcc3a6581a299f05f1d2d9.png"; fMedia = osImg; }
            else if (tid === 1886) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/d4ecc868f60343dac673fe75f95590/59d4ecc868f60343dac673fe75f95590.gif"; fMedia = osImg; }
            else if (tid === 1887) { osImg = "https://raw2.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/680d9ae73be9a216c217916a7e9e0a/43680d9ae73be9a216c217916a7e9e0a.gif"; fMedia = osImg; }
            else if (tid === 1888) { osImg = "https://i2c.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/c97151bb41c9dc96b9e86fc5029866/98c97151bb41c9dc96b9e86fc5029866.png"; fMedia = osImg; }
            else if (tid === 15) { osImg = "https://i2c.seadn.io/polygon/0x6c621364993e5cd4c6468930d287ba76ef64f366/7b1a99cef70dd681869e01c97c00e8/637b1a99cef70dd681869e01c97c00e8.png"; fMedia = osImg; }

            const wrapper = document.createElement('div');
            wrapper.className = "media-wrapper";
            const linkA = document.createElement('a');
            linkA.href = osLink;
            linkA.target = "_blank";

            if (VIDEO_IDS.includes(tid)) {
                linkA.className = "partial-link";
                wrapper.innerHTML = `<video src="${fMedia}" autoplay loop muted playsinline controls style="width:100%;height:100%;object-fit:cover;border-radius:15px;"></video>`;
            } else {
                linkA.className = "full-link";
                wrapper.innerHTML = `<img src="${osImg}" referrerPolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;border-radius:15px;" onerror="if(this.src != '${fMedia}') this.src='${fMedia}';">`;
            }
            
            wrapper.appendChild(linkA);
            media.appendChild(wrapper);

            document.getElementById('nftTitle').innerText = `CryptoGoro #${tid}`;
            resultDiv.style.display = 'block';

            // オーナー判定
            fetch(`https://polygon-mainnet.g.alchemy.com/nft/v3/${API_KEY}/getOwnersForNFT?contractAddress=${CONTRACT}&tokenId=${tid}`)
                .then(r => r.json()).then(o => {
                    if (requestId === currentRequestId && o.owners) {
                        const currentOwner = o.owners[0].toLowerCase();
                        if (currentOwner === STAKING_ADDR.toLowerCase()) {
                            ownerLink.innerText = "解析中...";
                            stakingTag.innerText = " (Now Staking)";
                        } else {
                            ownerLink.innerText = currentOwner.slice(0,6) + "..." + currentOwner.slice(-4);
                            ownerLink.href = `https://opensea.io/${currentOwner}?search[collections][0]=cryptogoros&collectionSlugs=cryptogoros`;
                            ownerLink.className = "active";
                        }
                    }
                });

            // 履歴スキャン
            const histUrl = `https://polygon-mainnet.g.alchemy.com/v2/${API_KEY}`;
            let allT = [];
            let pKey = null;

            async function scan() {
                if (requestId !== currentRequestId) return;
                const body = { id: 1, jsonrpc: "2.0", method: "alchemy_getAssetTransfers", params: [{ fromBlock: "0x0", toBlock: "latest", contractAddresses: [CONTRACT], category: ["erc721"], withMetadata: true, maxCount: "0x3e8" }] };
                if (pKey) body.params[0].pageKey = pKey;
                const res = await fetch(histUrl, { method: 'POST', body: JSON.stringify(body) }).then(r => r.json());
                if (res.result && res.result.transfers) {
                    const matched = res.result.transfers.filter(tx => {
                        const txId = tx.tokenId.startsWith("0x") ? parseInt(tx.tokenId, 16) : parseInt(tx.tokenId);
                        return txId === tid;
                    });
                    allT = allT.concat(matched);
                    if (res.result.pageKey) { pKey = res.result.pageKey; await scan(); } 
                    else { 
                        render(allT); 
                        finalizeOwnerDisplay(allT);
                    }
                }
            }

            function finalizeOwnerDisplay(list) {
                if (requestId !== currentRequestId || list.length === 0) return;
                list.sort((a, b) => b.metadata.blockTimestamp.localeCompare(a.metadata.blockTimestamp));
                const latestTx = list[0];
                
                if (latestTx.to.toLowerCase() === STAKING_ADDR.toLowerCase()) {
                    const trueOwner = latestTx.from;
                    ownerLink.innerText = trueOwner.slice(0,6) + "..." + trueOwner.slice(-4);
                    ownerLink.href = `https://opensea.io/${trueOwner}?search[collections][0]=cryptogoros&collectionSlugs=cryptogoros`;
                    ownerLink.className = "active";
                    stakingTag.innerText = " (Now Staking)";
                }
            }

            function render(list) {
                if (requestId !== currentRequestId) return;
                list.sort((a, b) => b.metadata.blockTimestamp.localeCompare(a.metadata.blockTimestamp));
                hBody.innerHTML = list.length ? "" : "<tr><td>履歴なし</td></tr>";
                list.forEach(tx => {
                    const d = tx.metadata?.blockTimestamp ? new Date(tx.metadata.blockTimestamp).toLocaleDateString() : "-";
                    const from = tx.from.startsWith("0x0000") ? "Mint" : tx.from.slice(0,6) + "...";
                    hBody.innerHTML += `<tr><td style="padding:10px 0;"><span style="color:#999; font-size:10px;">From: ${from}</span><br>To: ${tx.to.slice(0,6)}...</td><td style="text-align:right; color:#888; vertical-align:middle;">${d}</td><td style="text-align:right; vertical-align:middle;"><a href="https://polygonscan.com/tx/${tx.hash}" target="_blank" style="text-decoration:none;">📄</a></td></tr>`;
                });
            }
            scan();

            const traits = document.getElementById('nftTraits');
            traits.innerHTML = "";
            const attrs = meta.attributes || data.attributes;
            if (attrs && Array.isArray(attrs)) {
                attrs.forEach(a => {
                    const url = "https://opensea.io/collection/cryptogoros?traits=" + encodeURIComponent(JSON.stringify([{traitType:a.trait_type, values:[a.value]}]));
                    traits.innerHTML += `<a href="${url}" target="_blank" class="trait-card"><b>${a.trait_type}</b><br>${a.value}</a>`;
                });
            }

        } catch (e) { console.error(e); } finally { if (requestId === currentRequestId) { fetchBtn.disabled = false; fetchBtn.innerText = "表示"; } }
    }
};
</script>
</body>
</html>
